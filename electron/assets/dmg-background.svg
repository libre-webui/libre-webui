<svg width="760" height="500" viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="artShade" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#050506" stop-opacity="0.92"/>
      <stop offset="44%" stop-color="#050506" stop-opacity="0.48"/>
