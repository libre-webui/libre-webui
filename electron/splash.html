<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Loading Libre WebUI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-container {
      background: #1a1a1a;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      width: 350px;
      border: 1px solid #333;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #1a1a1a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
      overflow: hidden;
    }

    .logo svg {
      width: 56px;
      height: 56px;
      color: #ffffff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .tagline {
      color: #a0aec0;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .loader {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin: 0 auto;
      overflow: hidden;
    }

    .loader-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #f5e6d3, #d4c4b0);
      border-radius: 2px;
      animation: loading 1.5s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(350%);
      }
    }

    .status {
      color: #718096;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (prefers-color-scheme: light) {
      .splash-container {
        background: #ffffff;
        border-color: #e2e2dd;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.16);
      }

      .logo {
        background: #ffffff;
      }

      .logo svg {
        color: #0a0a0b;
      }

      .tagline {
        color: #55534f;
      }

      .loader {
        background: rgba(10, 10, 11, 0.08);
      }

      .status {
        color: #77736c;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo" role="img" aria-label="Libre WebUI">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M 11.5 18.0 L 11.5 32 A 20.5 20.5 0 0 0 50.58 40.66" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
        <path d="M 50.58 18.0 L 50.58 25.66" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="tagline">Your AI assistant is starting...</p>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
    <p class="status">Initializing services</p>
  </div>
</body>
</html>
