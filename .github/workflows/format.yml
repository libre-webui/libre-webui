name: Format & Lint

permissions:
  contents: read

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  format-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint (Frontend)
        run: npm run lint:frontend

      - name: Run ESLint (Backend)
        run: npm run lint:backend

      - name: TypeScript type checking (Frontend)
        run: cd frontend && npm run type-check

      - name: TypeScript type checking (Backend)
        run: cd backend && npm run type-check

  package-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: libre
          POSTGRES_PASSWORD: libre-ci-password
          POSTGRES_DB: libre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libre -d libre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Start MinIO storage fixture
        run: |
          docker run --detach --name libre-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=libreminio \
            --env MINIO_ROOT_PASSWORD=libre-ci-minio-password \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs libre-ci-minio
          exit 1

      - name: Run package tests
        run: npm run test:package
        env:
          TEST_POSTGRES_URL: postgresql://libre:libre-ci-password@127.0.0.1:5432/libre_test
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          TEST_S3_BUCKET: libre-ci-storage
          TEST_S3_REGION: us-east-1
          TEST_S3_ACCESS_KEY_ID: libreminio
          TEST_S3_SECRET_ACCESS_KEY: libre-ci-minio-password
          TEST_STORAGE_ENCRYPTION_KEY: '9191919191919191919191919191919191919191919191919191919191919191'
          TEST_TEAM_PLATFORM: '1'

      - name: Run three-replica team platform drill
        run: npm run test:team-platform
        env:
          TEST_TEAM_PLATFORM: '1'

  browser-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Install browser engines
        run: cd frontend && npx playwright install --with-deps chromium webkit

      - name: Run browser end-to-end tests
        run: npm run test:e2e

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

