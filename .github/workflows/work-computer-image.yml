name: Work Computer Image

# Builds and publishes the GUI sandbox image so deployments can pull it
# instead of building per-host — behind a filtered Docker API proxy that
# denies /build, `docker pull` + `docker tag libre-work-computer:latest`
# is the whole install. The base image pin is read from the Work runtime
# source so GUI and headless sandboxes always share shell tooling.

on:
  push:
    branches: [main, dev]
    paths:
      - 'deploy/work-computer/**'
      - '.github/workflows/work-computer-image.yml'
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: libre-webui/libre-work-computer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runtime's pinned base is the single source of truth; a drifting
      # workflow copy would silently split GUI and headless tooling.
      - name: Read the Work base image pin
        id: base
        run: |
          BASE=$(node -e "const source = require('fs').readFileSync('backend/src/services/workRuntimeShared.ts', 'utf8'); const match = source.match(/'(node:[^']+@sha256:[a-f0-9]{64})'/); if (!match) { console.error('base image pin not found'); process.exit(1); } console.log(match[1]);")
          echo "image=$BASE" >> "$GITHUB_OUTPUT"
          echo "Building on $BASE"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: deploy/work-computer
          push: true
          build-args: |
            WORK_BASE_IMAGE=${{ steps.base.outputs.image }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ github.ref_name == 'main' && format('{0}/{1}:latest', env.GHCR_REGISTRY, env.IMAGE_NAME) || '' }}
          cache-from: type=gha,scope=work-computer
          cache-to: type=gha,scope=work-computer,mode=max
