name: Release

permissions:
  contents: write
  pull-requests: read

on:
  push:
    tags:
      - 'v*'

jobs:
  release-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          npm ci
          npm run install:all

      - name: Run release preflight
        run: npm run release:check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Create the GitHub release. Desktop installers are built by the
  # libre-webui-desktop repository, which this workflow dispatches below;
  # that build uploads its artifacts onto this release.
  create-release:
    needs: release-preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          npm ci
          npm run install:all

      - name: Resolve release version
        id: release_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run tests and build
        run: npm run release:check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.release_version.outputs.version }}"
          CHANGELOG_SECTION=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_SECTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: Release v${{ steps.release_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror release to Forgejo
        run: >-
          node scripts/mirror-forgejo-releases.mjs
          --tag "v${{ steps.release_version.outputs.version }}"
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: |
          docker build -t libre-webui:${{ steps.release_version.outputs.version }} .
          docker build -t libre-webui:latest .

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Hand desktop packaging to libre-webui-desktop. The dispatch needs a
  # token that can reach that repository; without one the step reports and
  # the desktop build is started by hand (gh workflow run in that repo).
  dispatch-desktop-build:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Trigger the desktop installer build
        env:
          DISPATCH_TOKEN: ${{ secrets.DESKTOP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::DESKTOP_DISPATCH_TOKEN is not set; start the desktop build manually for $TAG."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/libre-webui/libre-webui-desktop/dispatches \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"tag\":\"$TAG\"}}"
          echo "Dispatched desktop build for $TAG."
