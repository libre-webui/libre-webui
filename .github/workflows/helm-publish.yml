name: Helm Chart Publish

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Validate release version policy
        id: versions
        run: |
          CHART_VERSION=$(grep '^version:' helm/libre-webui/Chart.yaml | awk '{print $2}')
          CHART_APP_VERSION=$(grep '^appVersion:' helm/libre-webui/Chart.yaml | awk '{print $2}' | tr -d "\"'")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [[ "$CHART_VERSION" != "$PACKAGE_VERSION" || "$CHART_APP_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Helm chart version ($CHART_VERSION), appVersion ($CHART_APP_VERSION), and package version ($PACKAGE_VERSION) must match."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "::error::Release tag ($TAG_VERSION) must match package and Helm version ($PACKAGE_VERSION)."
              exit 1
            fi
          fi

          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "Chart and app version: $CHART_VERSION"

      - name: Lint Helm chart
        run: helm lint helm/libre-webui

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: helm package helm/libre-webui --destination .helm-packages

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          helm push .helm-packages/libre-webui-${{ steps.versions.outputs.chart_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
