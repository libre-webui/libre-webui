services:
  libre-webui:
    # Raw-socket variant: root-equivalent control of the host Docker daemon.
    # Prefer docker-compose.work-proxy.yml, which enables Work through a
    # filtered API proxy instead of handing the application the socket. Keep
    # this override out of the stack unless its administrators are also host
    # admins.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - '${DOCKER_GID:?set DOCKER_GID}'
