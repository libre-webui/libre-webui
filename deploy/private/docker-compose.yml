name: libre-webui-private

services:
  libre-webui:
    image: ${LIBRE_WEBUI_IMAGE:-ghcr.io/libre-webui/libre-webui:main}
    container_name: libre-webui
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
      - /app/temp:rw,nosuid,nodev,noexec,size=512m
      - /app/backend/temp:rw,nosuid,nodev,noexec,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${LIBRE_WEBUI_PIDS_LIMIT:-512}
    mem_limit: ${LIBRE_WEBUI_MEMORY_LIMIT:-4g}
    cpus: ${LIBRE_WEBUI_CPU_LIMIT:-4}
    environment:
      NODE_ENV: production
      BASE_URL: https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
      CORS_ORIGIN: https://${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
      TRUST_PROXY: '1'
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      OLLAMA_BASE_URL: http://ollama:11434
      # Default SearXNG endpoint for the bundled web-search service. Search
      # stays off until an administrator enables it in Settings > Search.
      SEARXNG_URL: http://searxng:8080
      WORK_PREVIEW_BIND: 172.30.0.1
      # Stop a Work sandbox after this much inactivity (no command, terminal,
      # or preview traffic). Bounds how long an unwatched preview holds one of
      # the global admission slots; the workspace persists and restarts on
      # next use. 0 disables the sweep.
      WORK_RUNTIME_IDLE_TIMEOUT_MS: ${WORK_RUNTIME_IDLE_TIMEOUT_MS:-1800000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?set TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?set TURNSTILE_SECRET_KEY}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:?set TURNSTILE_EXPECTED_HOSTNAME}
    volumes:
      - libre-webui-data:/app/backend/data
    expose:
      - '3001'
    networks:
      - private
    depends_on:
      ollama:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/auth/system-info').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  ollama:
    image: ollama/ollama:latest
    container_name: libre-webui-ollama
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: ${OLLAMA_PIDS_LIMIT:-1024}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-12g}
    cpus: ${OLLAMA_CPU_LIMIT:-8}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - '11434'
    networks:
      - private
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  searxng:
    image: searxng/searxng:latest
    container_name: libre-webui-searxng
    restart: unless-stopped
    init: true
    # Upstream searxng-docker hardening: the entrypoint drops privileges
    # itself, so it needs exactly these capabilities and nothing else.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: ${SEARXNG_PIDS_LIMIT:-256}
    mem_limit: ${SEARXNG_MEMORY_LIMIT:-512m}
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng
    # Internal only: the app queries it server-side; nothing is published.
    expose:
      - '8080'
    networks:
      - private
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: libre-webui-cloudflared
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel-token
    volumes:
      - ./secrets/tunnel-token:/run/secrets/tunnel-token:ro
    networks:
      - private
    depends_on:
      libre-webui:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

networks:
  private:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: lwui-private
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  libre-webui-data:
  ollama-data:
