<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Libre Work Computer</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(160deg, #141824 0%, #2b3350 100%);
    color: #e6e9f2;
    font-family: "DejaVu Sans", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card { text-align: center; opacity: 0.92; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 20px;
    border-radius: 20px;
    background: linear-gradient(140deg, #6d8dff, #9a6dff);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 14px; margin: 0; color: #9aa3bd; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">L</div>
    <h1>Libre Work Computer</h1>
    <p>This screen belongs to your agent. Watch, take over, or teach it a task.</p>
  </div>
</body>
</html>
