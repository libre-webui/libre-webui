<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Libre Work Computer</title>
<link rel="stylesheet" href="file:///usr/local/share/libre-computer/fonts/fonts.css">
<style>
  :root {
    color-scheme: dark;
    --paper: #f7f5f0;
    --paper-secondary: #b6b2aa;
    --paper-muted: #858179;
    --ink: #0a0a0b;
    --coral: #ff7b52;
    --coral-deep: #BD4225;
    --hairline: rgba(255, 255, 255, 0.14);
    --display: 'Space Grotesk', 'Manrope', sans-serif;
    --body: 'Manrope', sans-serif;
    --mono: 'DM Mono', monospace;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(100deg,
        rgba(5, 5, 6, 0.88) 0%,
        rgba(5, 5, 6, 0.66) 40%,
        rgba(5, 5, 6, 0.22) 72%,
        rgba(5, 5, 6, 0.06) 100%),
      url('file:///usr/local/share/libre-computer/wallpaper.png') center / cover no-repeat,
      #0a0a0b;
    color: var(--paper);
    font-family: var(--body);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 34px 44px 0;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--paper-secondary);
    font-family: var(--mono);
    font-size: 0.67rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: '';
    width: 30px;
    height: 1px;
    background: var(--coral);
  }
  header svg { width: 26px; height: 26px; color: var(--paper); opacity: 0.9; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 44px 40px;
    max-width: 720px;
  }
  .clock-frame { overflow: hidden; padding-bottom: 0.06em; }
  #clock {
    font-family: var(--display);
    font-size: 118px;
    font-weight: 400;
    letter-spacing: -0.055em;
    line-height: 0.96;
    margin: 0;
  }
  #date {
    margin: 10px 0 0 6px;
    color: var(--paper-secondary);
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  form.command {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 34px 0 0 2px;
    max-width: 480px;
    border-bottom: 1px solid var(--hairline);
    padding: 0 2px 10px;
  }
  form.command:focus-within { border-color: rgba(255, 255, 255, 0.34); }
  .term-mark {
    color: var(--coral);
    font-family: var(--mono);
    font-size: 1.05rem;
    line-height: 1;
  }
  form.command input[type="text"] {
    flex: 1;
    border: 0;
    background: none;
    color: var(--paper);
    font-family: var(--mono);
    font-size: 0.85rem;
    outline: none;
  }
  form.command input[type="text"]::placeholder { color: var(--paper-muted); }
  .return-hint {
    color: var(--paper-muted);
    font-family: var(--mono);
    font-size: 0.65rem;
  }

  nav.proof {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 26px 0 0 4px;
    flex-wrap: wrap;
  }
  nav.proof a {
    color: var(--paper-secondary);
    font-family: var(--mono);
    font-size: 0.67rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    transition: color 0.2s ease;
  }
  nav.proof a:hover { color: var(--coral); }
  nav.proof span[aria-hidden] {
    width: 1px;
    height: 11px;
    background: var(--hairline);
  }

  footer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 28px;
    padding: 15px 44px 17px;
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    background: rgba(5, 5, 5, 0.92);
  }
  footer .still {
    color: rgba(255, 255, 255, 0.38);
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  footer p {
    margin: 0;
    color: rgba(255, 255, 255, 0.7);
    font-size: 0.78rem;
  }

  /* One quiet page-load sequence, borrowed from the site's reveal. */
  .reveal { opacity: 0; transform: translateY(12px); }
  .clock-frame #clock { transform: translateY(108%); }
  .ready .reveal {
    opacity: 1;
    transform: none;
    transition: opacity 620ms var(--ease-out), transform 620ms var(--ease-out);
  }
  .ready .clock-frame #clock {
    transform: none;
    transition: transform 900ms var(--ease-out) 80ms;
  }
  .ready .reveal.d1 { transition-delay: 120ms; }
  .ready .reveal.d2 { transition-delay: 220ms; }
  .ready .reveal.d3 { transition-delay: 320ms; }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .clock-frame #clock { opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header>
    <p class="eyebrow reveal">Libre Work Computer</p>
    <svg viewBox="0 0 64 64" role="img" aria-label="Libre WebUI" class="reveal">
      <path d="M 11.5 18.0 L 11.5 32 A 20.5 20.5 0 0 0 50.58 40.66"
        fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
      <path d="M 50.58 18.0 L 50.58 25.66"
        fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
    </svg>
  </header>

  <main>
    <div class="clock-frame">
      <h1 id="clock">--:--</h1>
    </div>
    <p id="date" class="reveal d1">&nbsp;</p>

    <form class="command reveal d2" action="https://duckduckgo.com/" method="get">
      <span class="term-mark" aria-hidden="true">›</span>
      <input type="text" name="q" placeholder="search the web" autocomplete="off" autofocus>
      <span class="return-hint" aria-hidden="true">↵</span>
      <input type="hidden" name="kae" value="d">
      <input type="hidden" name="k7" value="0a0a0b">
      <input type="hidden" name="kj" value="0a0a0b">
      <input type="hidden" name="k9" value="ff9a7a">
      <input type="hidden" name="kx" value="ff7b52">
      <input type="hidden" name="k8" value="f7f5f0">
    </form>

    <nav class="proof reveal d3" aria-label="Libre WebUI links">
      <a href="https://librewebui.org">Website</a>
      <span aria-hidden="true"></span>
      <a href="https://docs.librewebui.org">Docs</a>
      <span aria-hidden="true"></span>
      <a href="https://github.com/libre-webui/libre-webui">GitHub</a>
      <span aria-hidden="true"></span>
      <a href="https://git.kroonen.ai/libre-webui/libre-webui">Forgejo</a>
      <span aria-hidden="true"></span>
      <a href="https://kroonen.ai">kroonen.ai</a>
      <span aria-hidden="true"></span>
      <a href="https://start.duckduckgo.com/?kae=d&amp;k7=0a0a0b&amp;kj=0a0a0b&amp;k9=ff9a7a&amp;kx=ff7b52&amp;k8=f7f5f0">DuckDuckGo</a>
    </nav>
  </main>

  <footer class="reveal d3">
    <span class="still">Libre / Work Computer — Still 01</span>
    <p>This screen belongs to your agent. Watch, take over, or teach it a task.</p>
  </footer>

  <script>
    const clock = document.getElementById('clock');
    const date = document.getElementById('date');
    const tick = () => {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      date.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    };
    tick();
    setInterval(tick, 10_000);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add('ready');
    }));
  </script>
</body>
</html>
