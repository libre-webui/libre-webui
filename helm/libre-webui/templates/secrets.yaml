{{- if not .Values.secrets.existingSecret }}
{{- if or .Values.secrets.jwtSecret .Values.secrets.encryptionKey .Values.secrets.sessionSecret .Values.secrets.databaseUrl .Values.secrets.redisUrl .Values.secrets.storageEncryptionKeys .Values.secrets.s3AccessKeyId .Values.secrets.s3SecretAccessKey .Values.secrets.githubClientId .Values.secrets.huggingfaceClientId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "libre-webui.fullname" . }}-secrets
  labels:
    {{- include "libre-webui.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.encryptionKey }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sessionSecret }}
  session-secret: {{ .Values.secrets.sessionSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  redis-url: {{ .Values.secrets.redisUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.storageEncryptionKeys }}
  storage-encryption-keys: {{ .Values.secrets.storageEncryptionKeys | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.s3AccessKeyId }}
  s3-access-key-id: {{ .Values.secrets.s3AccessKeyId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SecretAccessKey }}
  s3-secret-access-key: {{ .Values.secrets.s3SecretAccessKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SessionToken }}
  s3-session-token: {{ .Values.secrets.s3SessionToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.githubClientId }}
  github-client-id: {{ .Values.secrets.githubClientId | b64enc | quote }}
  github-client-secret: {{ .Values.secrets.githubClientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.huggingfaceClientId }}
  huggingface-client-id: {{ .Values.secrets.huggingfaceClientId | b64enc | quote }}
  huggingface-client-secret: {{ .Values.secrets.huggingfaceClientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
