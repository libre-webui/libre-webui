{{- if eq .Values.env.LIBRE_PLATFORM_MODE "team" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "libre-webui.fullname" . }}-worker
  labels:
    {{- include "libre-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: durable-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    # Durable leases recover interrupted work after the exact-version rollout.
    # Recreate prevents old/new worker pods from overlapping; the documented
    # pre-drain procedure coordinates this Deployment with the app Deployment.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "libre-webui.name" . }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "libre-webui.name" . }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: durable-worker
    spec:
      serviceAccountName: {{ include "libre-webui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: durable-worker
          image: "{{ .Values.image.repository }}{{ if .Values.image.tag }}:{{ .Values.image.tag }}{{ else if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "backend/dist/worker.js"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ include "libre-webui.ollamaUrl" . | quote }}
            - name: OLLAMA_TIMEOUT
              value: {{ .Values.env.OLLAMA_TIMEOUT | quote }}
            - name: OLLAMA_LONG_OPERATION_TIMEOUT
              value: {{ .Values.env.OLLAMA_LONG_OPERATION_TIMEOUT | quote }}
            - name: OLLAMA_MAX_CONTEXT
              value: {{ .Values.env.OLLAMA_MAX_CONTEXT | quote }}
            - name: AGENT_CLI_MODELS_ENABLED
              value: {{ .Values.env.AGENT_CLI_MODELS_ENABLED | quote }}
            - name: CODEX_OAUTH_MODELS_ENABLED
              value: {{ .Values.env.CODEX_OAUTH_MODELS_ENABLED | quote }}
            - name: DATA_DIR
              value: /tmp/libre-data
            - name: PLATFORM_PREFLIGHT_TMP_DIR
              value: /tmp/libre-preflight
            - name: LIBRE_PLATFORM_MODE
              value: team
            - name: DATABASE_BACKEND
              value: postgres
            - name: DATABASE_SSL_MODE
              value: {{ .Values.env.DATABASE_SSL_MODE | quote }}
            - name: POSTGRES_MIGRATION_MODE
              value: {{ .Values.env.POSTGRES_MIGRATION_MODE | quote }}
            - name: POSTGRES_POOL_MAX
              value: {{ .Values.env.POSTGRES_POOL_MAX | quote }}
            - name: POSTGRES_CONNECT_TIMEOUT_MS
              value: {{ .Values.env.POSTGRES_CONNECT_TIMEOUT_MS | quote }}
            - name: POSTGRES_IDLE_TIMEOUT_MS
              value: {{ .Values.env.POSTGRES_IDLE_TIMEOUT_MS | quote }}
            - name: POSTGRES_STATEMENT_TIMEOUT_MS
              value: {{ .Values.env.POSTGRES_STATEMENT_TIMEOUT_MS | quote }}
            - name: POSTGRES_MIGRATION_LOCK_TIMEOUT_MS
              value: {{ .Values.env.POSTGRES_MIGRATION_LOCK_TIMEOUT_MS | quote }}
            - name: BLOB_STORE_BACKEND
              value: s3
            - name: BLOB_QUOTA_BYTES_PER_USER
              value: {{ .Values.env.BLOB_QUOTA_BYTES_PER_USER | int64 | quote }}
            - name: BLOB_QUOTA_RESERVATION_TTL_MS
              value: {{ .Values.env.BLOB_QUOTA_RESERVATION_TTL_MS | int64 | quote }}
            - name: VECTOR_STORE_BACKEND
              value: pgvector
            - name: COORDINATION_BACKEND
              value: redis
            - name: JOB_WORKER_MODE
              value: external
            - name: REDIS_KEY_PREFIX
              value: {{ .Values.env.REDIS_KEY_PREFIX | quote }}
            - name: REDIS_CONNECT_TIMEOUT_MS
              value: {{ .Values.env.REDIS_CONNECT_TIMEOUT_MS | quote }}
            - name: STORAGE_ENCRYPTION_ACTIVE_KEY_ID
              value: {{ .Values.env.STORAGE_ENCRYPTION_ACTIVE_KEY_ID | quote }}
            - name: S3_BUCKET
              value: {{ .Values.env.S3_BUCKET | quote }}
            - name: S3_REGION
              value: {{ .Values.env.S3_REGION | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.env.S3_ENDPOINT | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.env.S3_FORCE_PATH_STYLE | quote }}
            - name: S3_BLOB_PREFIX
              value: {{ .Values.env.S3_BLOB_PREFIX | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: redis-url
            - name: STORAGE_ENCRYPTION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: storage-encryption-keys
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: encryption-key
            {{- if or .Values.secrets.s3AccessKeyId .Values.secrets.existingSecret }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: s3-access-key-id
                  {{- if not .Values.secrets.s3AccessKeyId }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.secrets.s3SecretAccessKey .Values.secrets.existingSecret }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: s3-secret-access-key
                  {{- if not .Values.secrets.s3SecretAccessKey }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.secrets.s3SessionToken .Values.secrets.existingSecret }}
            - name: S3_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "libre-webui.secretName" . }}
                  key: s3-session-token
                  {{- if not .Values.secrets.s3SessionToken }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if .Values.work.enabled }}
            - name: WORK_RUNTIME_BACKEND
              value: kubernetes
            - name: WORK_K8S_NAMESPACE
              value: {{ .Values.work.namespace | quote }}
            - name: WORK_K8S_WORKSPACE_SIZE
              value: {{ .Values.work.workspaceSize | quote }}
            {{- if .Values.work.storageClass }}
            - name: WORK_K8S_STORAGE_CLASS
              value: {{ .Values.work.storageClass | quote }}
            {{- end }}
            {{- if .Values.work.runtimeImage }}
            - name: WORK_RUNTIME_IMAGE
              value: {{ .Values.work.runtimeImage | quote }}
            {{- end }}
            {{- range $name, $value := .Values.work.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir:
            sizeLimit: {{ .Values.team.tempSizeLimit | quote }}
{{- end }}
