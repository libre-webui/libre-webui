x-libre-team-environment: &libre-team-environment
  NODE_ENV: production
  DOCKER_ENV: 'true'
  PORT: '3001'
  DATA_DIR: /tmp/libre-data
  PLATFORM_PREFLIGHT_TMP_DIR: /tmp/libre-preflight
  LIBRE_PLATFORM_MODE: team
  DATABASE_BACKEND: postgres
  DATABASE_URL: postgresql://libre:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/libre
  # This Compose-owned PostgreSQL listener is isolated on the private project
  # network. External/managed PostgreSQL keeps the runtime's verify-full default.
  DATABASE_SSL_MODE: disable
  POSTGRES_MIGRATION_MODE: ${POSTGRES_MIGRATION_MODE:-apply}
  POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
  POSTGRES_CONNECT_TIMEOUT_MS: ${POSTGRES_CONNECT_TIMEOUT_MS:-5000}
  POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
  POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-30000}
  POSTGRES_MIGRATION_LOCK_TIMEOUT_MS: ${POSTGRES_MIGRATION_LOCK_TIMEOUT_MS:-60000}
  BLOB_STORE_BACKEND: s3
  BLOB_QUOTA_BYTES_PER_USER: ${BLOB_QUOTA_BYTES_PER_USER:-10737418240}
  BLOB_QUOTA_RESERVATION_TTL_MS: ${BLOB_QUOTA_RESERVATION_TTL_MS:-3600000}
  VECTOR_STORE_BACKEND: pgvector
  COORDINATION_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  REDIS_KEY_PREFIX: libre-team
  REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-5000}
  JOB_WORKER_MODE: external
  STORAGE_ENCRYPTION_ACTIVE_KEY_ID: ${STORAGE_ENCRYPTION_ACTIVE_KEY_ID:?set STORAGE_ENCRYPTION_ACTIVE_KEY_ID}
  STORAGE_ENCRYPTION_KEYS: ${STORAGE_ENCRYPTION_KEYS:?set STORAGE_ENCRYPTION_KEYS}
  S3_BUCKET: libre-blobs
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: 'true'
  S3_BLOB_PREFIX: v1
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  # One trusted gateway hop; Express then derives the real peer consistently
  # for shared security rate limiting. Do not use `true` on public deployments.
  TRUST_PROXY: '1'
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300000}
  OLLAMA_LONG_OPERATION_TIMEOUT: ${OLLAMA_LONG_OPERATION_TIMEOUT:-900000}
  OLLAMA_MAX_CONTEXT: ${OLLAMA_MAX_CONTEXT:-32768}
  # Durable chat execution happens in the external worker. Node-local agent
  # binaries and Codex auth files cannot be advertised safely in this profile.
  AGENT_CLI_MODELS_ENABLED: 'false'
  CODEX_OAUTH_MODELS_ENABLED: 'false'

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: libre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: libre
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U libre -d libre']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - libre-team-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.5-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - libre-team-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - libre-team-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing local/libre-blobs;
        mc version enable local/libre-blobs
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  libre-webui:
    build: .
    image: ${LIBRE_TEAM_IMAGE:-libre-webui:team}
    expose: ['3001']
    environment:
      <<: *libre-team-environment
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  durable-worker:
    image: ${LIBRE_TEAM_IMAGE:-libre-webui:team}
    command: ['node', 'backend/dist/worker.js']
    # The application image's HTTP health check targets the web process. The
    # worker has no HTTP listener; Docker already restarts it when PID 1 exits.
    healthcheck:
      disable: true
    environment:
      <<: *libre-team-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    image: nginx:1.29.0-alpine
    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - ./deploy/team/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - libre-webui

volumes:
  libre-team-postgres:
  libre-team-redis:
  libre-team-minio:
