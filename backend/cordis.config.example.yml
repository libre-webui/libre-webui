# Example host settings for Libre WebUI's embedded DSH engine.
#
# Copy this file to the backend package root as `cordis.config.yml` (or point
# LIBRE_CORDIS_SETTINGS at it) and pair it with `cordis.patch.yml` (see
# cordis.patch.example.yml). An administrator then enables the engine in
# Settings -> User Management -> Access & policies -> Cordis Engine.
#
# This document holds Libre WebUI's own settings for the engine: which provider
# the model adapter mounts, where its credential comes from, and which features
# are exposed. It never contains a secret — `apiKeyEnv` names the environment
# variable holding the key, and the adapter resolves that variable per request,
# so rotating a key needs no restart.
#
# The engine's plugin list lives in `cordis.patch.yml`, because the Cordis
# `Include` carrier requires that file to be a top-level array.
#
# Every value here can be overridden by a LIBRE_CORDIS_* environment variable.

# Log every Cordis activation transition. Useful when a row does not start.
trace: false

# Optional local DSH provider connection. Install the provider-only bundle in
# the running DSH profile first; see docs/65-CORDIS_CONFIGURATION.md. Both apps
# must run as the same OS user. This does not copy provider keys or run native
# host agents. LIBRE_DSH_PROVIDER_SOCKET overrides this absolute socket path.
# nativeProvider:
#   socketPath: /absolute/private-directory/provider.sock

model:
  # `libre-webui` serves the engine through this deployment's own provider
  # layer, so it uses the models and credentials already configured in the UI.
  # No API key, base URL, or model list belongs here.
  #
  # `none` starts the engine without model access. `deepseek` and `pi-ai` mount
  # a provider package directly, which requires installing it first — those
  # packages are deliberately not dependencies of this backend.
  provider: libre-webui

  # The model the engine requests. Empty means the app's default model, falling
  # back to the first chat model the provider layer reports.
  model: ''

  # Only used by the `deepseek` and `pi-ai` modes, where the engine talks to a
  # provider package instead of the provider layer. Leave it out otherwise.
  route: ''
  apiKeyEnv: OPENAI_API_KEY
  baseUrl: ''
  providers: {}

features:
  # `enabled` is deliberately omitted so an administrator controls the engine
  # from Settings. Stating it here pins the value and greys out that toggle;
  # the LIBRE_CORDIS_ENABLED environment variable pins it the same way.
  # Accept chat turns that stream model output back to the UI.
  streaming: true
  # Allow tools in model prompts and execution, and expose their registry.
  tools: true
  # Keep sessions on disk so a restart resumes conversations.
  persistence: true

# Where the engine may treat as its default workspace, and where it persists
# sessions. Both default under Libre WebUI's data directory, which keeps engine
# state inside the same private runtime directory as the rest of the app.
# workspacePath: ''
# sessionStorePath: ''
