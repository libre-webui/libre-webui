appId: com.librewebui.app
productName: Libre WebUI Frontend
copyright: Copyright © 2025 Kroonen AI, Inc.

directories:
  output: dist-electron
  buildResources: electron/assets

files:
  - electron/**/*
  - '!electron/assets/dmg-background.png'
  - '!electron/assets/dmg-background@2x.png'
  - '!electron/assets/dmg-background.tiff'
  - '!electron/assets/dmg-art.png'
  - '!electron/assets/icon.icns'
  - '!electron/assets/icon.ico'

artifactBuildCompleted: scripts/finalize-macos-artifact.cjs

extraResources:
  - from: frontend/dist
    to: frontend/dist
    filter:
      - '**/*'
  - from: plugins
    to: plugins
    filter:
      - '**/*.json'
  - from: electron/assets/icons
    to: icons
    filter:
      - '**/*.png'

# Note: This desktop app connects to a locally-running backend server.
# The backend must be started separately or the user needs Ollama running.
# For development: npm run dev
# For production: run the backend server separately

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: electron/assets/icon.icns
  darkModeSupport: true
  # Temporary distribution mode until Developer ID credentials are available.
  # This produces a structurally valid bundle without identifying it to Apple.
  identity: '-'
  hardenedRuntime: true
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  notarize: false
  gatekeeperAssess: false
  artifactName: 'Libre-WebUI-Frontend-${version}-mac-arm64.${ext}'
  extraResources:
    - from: electron/assets/dmg-background.tiff
      to: dmg-background.tiff

dmg:
  title: 'Install Libre WebUI'
  background: electron/assets/dmg-background.tiff
  icon: null
  iconSize: 96
  iconTextSize: 12
  contents:
    - x: 180
      y: 300
    - x: 580
      y: 300
      type: link
      path: /Applications
  window:
    width: 760
    height: 500

# For future x64 support
# mac:
#   target:
#     - target: dmg
#       arch:
#         - arm64
#         - x64

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: electron/assets/icons
  artifactName: 'Libre-WebUI-Frontend-${version}.${ext}'

deb:
  artifactName: 'Libre-WebUI-Frontend-${version}-${arch}.${ext}'

win:
  target:
    - nsis
    - portable
  icon: electron/assets/icon.ico
  artifactName: 'Libre-WebUI-Frontend-${version}.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: 'Libre-WebUI-Frontend-Setup-${version}.${ext}'

publish:
  provider: github
  owner: libre-webui
  repo: libre-webui
